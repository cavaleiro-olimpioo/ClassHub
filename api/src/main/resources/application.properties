spring.application.name=api

server.servlet.context-path=/api

# Comma-separated to support the configured local origin and the Vite frontend.
app.cors.allowed-origins=http://localhost:5173,http://localhost:5432
app.jwt.secret=${APP_JWT_SECRET:classhub-development-jwt-secret-change-me-before-production-2026}
app.jwt.expiration-hours=8
app.seed-demo-users=true

spring.datasource.url=jdbc:postgresql://localhost:5432/classhubdb
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.jdbc.lob.non_contextual-creation=true

spring.jpa.show-sql=true
