spring.application.name=phonkhub-api

# O app foi deixado sem context-path para que o proxy/public path (/api) não seja duplicado
# em relação ao Tailscale Funnel e ao NGINX.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5432}
app.jwt.secret=${APP_JWT_SECRET:phonkhub-jwt-secret-resenha-67-bora-bill-la-ele-amostradinho-jennifer-kirk-floyd-2026}
app.jwt.expiration-hours=8
app.seed-demo-users=true

spring.datasource.url=jdbc:postgresql://localhost:5432/phonkhubdb
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.jdbc.lob.non_contextual-creation=true

spring.jpa.show-sql=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}