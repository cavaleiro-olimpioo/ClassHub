spring.application.name=api

# O app foi deixado sem context-path para que o proxy/public path (/api) não seja duplicado
# em relação ao Tailscale Funnel e ao NGINX.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-hours=8
app.seed-demo-users=${APP_SEED_DEMO_USERS:false}

spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/classhubdb}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual-creation=true
spring.jpa.show-sql=false
