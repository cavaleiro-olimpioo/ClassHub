services:
  db:
    image: postgres:16-alpine
    container_name: taskmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - taskmanager-net

  # backend:
  #   build: ./backend
  #   depends_on:
  #     - db

  # frontend:
  #   build: ./frontend
  #   depends_on:
  #     - backend

volumes:
  pgdata:

networks:
  taskmanager-net:
    driver: bridge