services:
  db:
    image: postgres:16-alpine
    container_name: classhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: classhubdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d classhubdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - classhub-net

  backend:
    build: ./api
    container_name: classhub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/classhubdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,https://pegasus.tail2cdb38.ts.net
    ports:
      - "8080:8080"
    networks:
      - classhub-net

  frontend:
    build: ./frontend
    container_name: classhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - classhub-net

volumes:
  pgdata:

networks:
  classhub-net:
    driver: bridge