<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achados e Perdidos (Admin) - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Achados e Perdidos</h1>
            <p class="page-subtitle">Registro de itens encontrados na escola e controle de devoluções</p>
          </div>
          <button class="btn btn-primary" onclick="openItemModal()">
            ➕ Novo Item Encontrado
          </button>
        </div>

        <!-- Filtros -->
        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="filter-categoria">Categoria</label>
              <select id="filter-categoria" class="form-select">
                <option value="">Todas as Categorias</option>
                <option value="UNIFORME">Uniforme</option>
                <option value="MATERIAL">Material Escolar</option>
                <option value="ELETRONICO">Eletrônicos</option>
                <option value="OUTRO">Outros</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="filter-status">Status</label>
              <select id="filter-status" class="form-select">
                <option value="">Todos os Status</option>
                <option value="NAO_REIVINDICADO">Não Reivindicado</option>
                <option value="DEVOLVIDO">Devolvido</option>
              </select>
            </div>
            <div>
              <button class="btn btn-secondary" onclick="loadItens()">🔍 Filtrar</button>
            </div>
          </div>
        </div>

        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadItens();
    });

    async function loadItens() {
      const container = document.getElementById('table-container');
      container.innerHTML = UI.renderLoading('Carregando itens...');

      const cat = document.getElementById('filter-categoria').value;
      const status = document.getElementById('filter-status').value;

      let params = [];
      if (cat) params.push(`categoria=${encodeURIComponent(cat)}`);
      if (status) params.push(`status=${encodeURIComponent(status)}`);
      const query = params.length ? `?${params.join('&')}` : '';

      try {
        const response = await api.get(`/achados-perdidos${query}`);
        const itens = Array.isArray(response) ? response : (response.content || []);

        const columns = [
          { key: 'descricao', label: 'Descrição do Item' },
          { key: 'categoria', label: 'Categoria', render: (val) => val },
          { key: 'localEncontrado', label: 'Local Encontrado' },
          { key: 'data', label: 'Data Registro', render: (val) => UI.formatDate(val) },
          { key: 'status', label: 'Status', render: (val) => UI.badge(val) },
          {
            key: 'acoes',
            label: 'Ações',
            render: (_, row) => `
              <div class="table-actions">
                ${row.status === 'NAO_REIVINDICADO' ? `
                  <button class="btn btn-sm btn-success" onclick="marcarDevolvido('${row.id}')">✓ Marcar Devolvido</button>
                ` : ''}
                <button class="btn btn-sm btn-secondary" onclick="openItemModal('${row.id}')">✏️ Editar</button>
                <button class="btn btn-sm btn-danger" onclick="excluirItem('${row.id}')">🗑️ Excluir</button>
              </div>
            `
          }
        ];

        container.innerHTML = UI.renderTable(columns, itens, 'Nenhum item cadastrado no momento.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar a lista de achados e perdidos.');
      }
    }

    async function openItemModal(id = null) {
      let item = { descricao: '', categoria: 'UNIFORME', localEncontrado: '', data: new Date().toISOString().split('T')[0] };

      if (id) {
        try {
          const response = await api.get(`/achados-perdidos`);
          const list = Array.isArray(response) ? response : (response.content || []);
          const found = list.find(i => i.id === id);
          if (found) item = found;
        } catch (e) {}
      }

      const formHtml = `
        <form id="form-item">
          <div class="form-group">
            <label>Descrição do Item <span class="required">*</span></label>
            <input type="text" id="i-desc" class="form-control" value="${item.descricao}" placeholder="Ex: Casaco azul tamanho M" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Categoria <span class="required">*</span></label>
              <select id="i-cat" class="form-select" required>
                <option value="UNIFORME" ${item.categoria === 'UNIFORME' ? 'selected' : ''}>Uniforme</option>
                <option value="MATERIAL" ${item.categoria === 'MATERIAL' ? 'selected' : ''}>Material Escolar</option>
                <option value="ELETRONICO" ${item.categoria === 'ELETRONICO' ? 'selected' : ''}>Eletrônicos</option>
                <option value="OUTRO" ${item.categoria === 'OUTRO' ? 'selected' : ''}>Outros</option>
              </select>
            </div>
            <div class="form-group">
              <label>Data Encontrado <span class="required">*</span></label>
              <input type="date" id="i-data" class="form-control" value="${item.data}" required>
            </div>
          </div>
          <div class="form-group">
            <label>Local Encontrado <span class="required">*</span></label>
            <input type="text" id="i-local" class="form-control" value="${item.localEncontrado}" placeholder="Ex: Pátio do Recreio" required>
          </div>
        </form>
      `;

      UI.modal({
        title: id ? 'Editar Item Encontrado' : 'Registrar Novo Item Encontrado',
        content: formHtml,
        actions: [
          { label: 'Cancelar', class: 'btn-secondary', onClick: () => UI.closeModal() },
          {
            label: 'Salvar Item',
            class: 'btn-primary',
            onClick: async () => {
              const body = {
                descricao: document.getElementById('i-desc').value.trim(),
                categoria: document.getElementById('i-cat').value,
                data: document.getElementById('i-data').value,
                localEncontrado: document.getElementById('i-local').value.trim()
              };

              if (!body.descricao || !body.categoria || !body.data || !body.localEncontrado) {
                UI.toast('Preencha todos os campos obrigatórios!', 'warning');
                return;
              }

              try {
                if (id) {
                  await api.put(`/achados-perdidos/${id}`, body);
                  UI.toast('Item atualizado!', 'success');
                } else {
                  await api.post('/achados-perdidos', body);
                  UI.toast('Item registrado!', 'success');
                }
                UI.closeModal();
                loadItens();
              } catch (e) {}
            }
          }
        ]
      });
    }

    function marcarDevolvido(id) {
      UI.confirm({
        title: 'Marcar Item como Devolvido',
        message: 'Confirma que este item foi entregue ao legítimo dono?',
        confirmText: 'Sim, Devolver',
        onConfirm: async () => {
          try {
            await api.put(`/achados-perdidos/${id}/devolver`, {});
            UI.toast('Status atualizado para DEVOLVIDO!', 'success');
            loadItens();
          } catch (e) {}
        }
      });
    }

    function excluirItem(id) {
      UI.confirm({
        title: 'Excluir Item',
        message: 'Deseja excluir permanentemente este registro?',
        onConfirm: async () => {
          try {
            await api.delete(`/achados-perdidos/${id}`);
            UI.toast('Item excluído!', 'success');
            loadItens();
          } catch (e) {}
        }
      });
    }
  </script>
</body>
</html>
