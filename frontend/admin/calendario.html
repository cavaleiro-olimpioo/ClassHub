<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário Escolar (Admin) - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Calendário Escolar</h1>
            <p class="page-subtitle">Gerenciamento de dias letivos, feriados, recessos e eventos</p>
          </div>
          <button class="btn btn-primary" onclick="openEventoModal()">
            ➕ Novo Evento / Data
          </button>
        </div>

        <!-- Filtro por Ano/Mês -->
        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="filter-ano">Ano Letivo</label>
              <input type="number" id="filter-ano" class="form-control" value="2025">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="filter-mes">Mês (Opcional)</label>
              <select id="filter-mes" class="form-select">
                <option value="">Todos os meses</option>
                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
              </select>
            </div>
            <div>
              <button class="btn btn-secondary" onclick="loadCalendario()">🔍 Filtrar</button>
            </div>
          </div>
        </div>

        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const currentYear = new Date().getFullYear();
      document.getElementById('filter-ano').value = currentYear;
      await loadCalendario();
    });

    async function loadCalendario() {
      const container = document.getElementById('table-container');
      container.innerHTML = UI.renderLoading('Carregando calendário...');

      const ano = document.getElementById('filter-ano').value;
      const mes = document.getElementById('filter-mes').value;

      let query = `?anoLetivo=${ano}`;
      if (mes) query += `&mes=${mes}`;

      try {
        const eventos = await api.get(`/calendario${query}`);

        const columns = [
          {
            key: 'data',
            label: 'Data',
            render: (val) => UI.formatDate(val)
          },
          { key: 'titulo', label: 'Título / Descrição Curta' },
          {
            key: 'tipo',
            label: 'Tipo',
            render: (val) => UI.badge(val)
          },
          { key: 'descricao', label: 'Detalhes' },
          {
            key: 'acoes',
            label: 'Ações',
            render: (_, row) => `
              <div class="table-actions">
                <button class="btn btn-sm btn-secondary" onclick="openEventoModal('${row.id}')">✏️ Editar</button>
                <button class="btn btn-sm btn-danger" onclick="excluirEvento('${row.id}')">🗑️ Excluir</button>
              </div>
            `
          }
        ];

        container.innerHTML = UI.renderTable(columns, eventos, 'Nenhum registro no calendário.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar os dados do calendário.');
      }
    }

    async function openEventoModal(id = null) {
      let ev = { data: '', anoLetivo: new Date().getFullYear(), tipo: 'LETIVO', titulo: '', descricao: '' };

      if (id) {
        try {
          const list = await api.get(`/calendario?anoLetivo=${document.getElementById('filter-ano').value}`);
          const found = list.find(item => item.id === id);
          if (found) ev = found;
        } catch (e) {}
      }

      const formHtml = `
        <form id="form-cal">
          <div class="form-row">
            <div class="form-group">
              <label>Data <span class="required">*</span></label>
              <input type="date" id="cal-data" class="form-control" value="${ev.data}" required>
            </div>
            <div class="form-group">
              <label>Ano Letivo <span class="required">*</span></label>
              <input type="number" id="cal-ano" class="form-control" value="${ev.anoLetivo || 2025}" required>
            </div>
          </div>
          <div class="form-group">
            <label>Tipo de Dia <span class="required">*</span></label>
            <select id="cal-tipo" class="form-select" required>
              <option value="LETIVO" ${ev.tipo === 'LETIVO' ? 'selected' : ''}>Dia Letivo</option>
              <option value="FERIADO" ${ev.tipo === 'FERIADO' ? 'selected' : ''}>Feriado</option>
              <option value="RECESSO" ${ev.tipo === 'RECESSO' ? 'selected' : ''}>Recesso</option>
              <option value="EVENTO" ${ev.tipo === 'EVENTO' ? 'selected' : ''}>Evento Escolar</option>
            </select>
          </div>
          <div class="form-group">
            <label>Título / Nome do Evento <span class="required">*</span></label>
            <input type="text" id="cal-titulo" class="form-control" value="${ev.titulo}" placeholder="Ex: Início das Aulas" required>
          </div>
          <div class="form-group">
            <label>Descrição Detalhada</label>
            <textarea id="cal-desc" class="form-control" placeholder="Observações adicionais...">${ev.descricao || ''}</textarea>
          </div>
        </form>
      `;

      UI.modal({
        title: id ? 'Editar Registro do Calendário' : 'Novo Evento / Dia no Calendário',
        content: formHtml,
        actions: [
          { label: 'Cancelar', class: 'btn-secondary', onClick: () => UI.closeModal() },
          {
            label: 'Salvar',
            class: 'btn-primary',
            onClick: async () => {
              const body = {
                data: document.getElementById('cal-data').value,
                anoLetivo: Number(document.getElementById('cal-ano').value),
                tipo: document.getElementById('cal-tipo').value,
                titulo: document.getElementById('cal-titulo').value.trim(),
                descricao: document.getElementById('cal-desc').value.trim() || null
              };

              if (!body.data || !body.anoLetivo || !body.tipo || !body.titulo) {
                UI.toast('Preencha os campos obrigatórios!', 'warning');
                return;
              }

              try {
                if (id) {
                  await api.put(`/calendario/${id}`, body);
                  UI.toast('Registro atualizado!', 'success');
                } else {
                  await api.post('/calendario', body);
                  UI.toast('Registro criado!', 'success');
                }
                UI.closeModal();
                loadCalendario();
              } catch (e) {}
            }
          }
        ]
      });
    }

    function excluirEvento(id) {
      UI.confirm({
        title: 'Excluir do Calendário',
        message: 'Deseja remover este registro do calendário escolar?',
        onConfirm: async () => {
          try {
            await api.delete(`/calendario/${id}`);
            UI.toast('Registro removido!', 'success');
            loadCalendario();
          } catch (e) {}
        }
      });
    }
  </script>
</body>
</html>
