<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Disciplinas - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Gerenciamento de Disciplinas</h1>
            <p class="page-subtitle">Cadastro de matérias e cargas horárias</p>
          </div>
          <button class="btn btn-primary" onclick="openDisciplinaModal()">
            ➕ Nova Disciplina
          </button>
        </div>

        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadDisciplinas();
    });

    async function loadDisciplinas() {
      const container = document.getElementById('table-container');
      container.innerHTML = UI.renderLoading('Carregando disciplinas...');

      try {
        const disciplinas = await api.get('/disciplinas');

        const columns = [
          { key: 'nome', label: 'Nome da Disciplina' },
          { key: 'cargaHoraria', label: 'Carga Horária (Aulas/Semana)' },
          {
            key: 'acoes',
            label: 'Ações',
            render: (_, row) => `
              <div class="table-actions">
                <button class="btn btn-sm btn-secondary" onclick="openDisciplinaModal('${row.id}', '${row.nome}', ${row.cargaHoraria})">✏️ Editar</button>
              </div>
            `
          }
        ];

        container.innerHTML = UI.renderTable(columns, disciplinas, 'Nenhuma disciplina cadastrada.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro ao carregar', 'Não foi possível carregar a lista de disciplinas.');
      }
    }

    function openDisciplinaModal(id = null, nome = '', cargaHoraria = 4) {
      const formHtml = `
        <form id="form-disciplina">
          <div class="form-group">
            <label>Nome da Disciplina <span class="required">*</span></label>
            <input type="text" id="disc-nome" class="form-control" value="${nome}" placeholder="Ex: Matemática" required>
          </div>
          <div class="form-group">
            <label>Carga Horária Semanal (aulas) <span class="required">*</span></label>
            <input type="number" id="disc-carga" class="form-control" value="${cargaHoraria}" min="1" max="20" required>
          </div>
        </form>
      `;

      UI.modal({
        title: id ? 'Editar Disciplina' : 'Nova Disciplina',
        content: formHtml,
        actions: [
          { label: 'Cancelar', class: 'btn-secondary', onClick: () => UI.closeModal() },
          {
            label: 'Salvar',
            class: 'btn-primary',
            onClick: async () => {
              const body = {
                nome: document.getElementById('disc-nome').value.trim(),
                cargaHoraria: Number(document.getElementById('disc-carga').value)
              };

              if (!body.nome || !body.cargaHoraria) {
                UI.toast('Preencha todos os campos obrigatórios!', 'warning');
                return;
              }

              try {
                if (id) {
                  await api.put(`/disciplinas/${id}`, body);
                  UI.toast('Disciplina atualizada!', 'success');
                } else {
                  await api.post('/disciplinas', body);
                  UI.toast('Disciplina cadastrada!', 'success');
                }
                UI.closeModal();
                loadDisciplinas();
              } catch (e) {}
            }
          }
        ]
      });
    }
  </script>
</body>
</html>
