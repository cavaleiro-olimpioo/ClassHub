<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade de Horários - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Montagem da Grade de Horários</h1>
            <p class="page-subtitle">Organização das aulas semanais por turma</p>
          </div>
          <button class="btn btn-primary" onclick="openAddHorarioModal()">
            ➕ Adicionar Aula
          </button>
        </div>

        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group" style="margin-bottom: 0; max-width: 400px;">
            <label for="select-turma">Selecione a Turma</label>
            <select id="select-turma" class="form-select" onchange="loadGradeTurma()">
              <option value="">Selecione uma turma...</option>
            </select>
          </div>
        </div>

        <div id="grade-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    let turmasList = [];
    let disciplinasList = [];
    let professoresList = [];

    const DIAS_SEMANA = [
      { id: 1, nome: 'Segunda-feira' },
      { id: 2, nome: 'Terça-feira' },
      { id: 3, nome: 'Quarta-feira' },
      { id: 4, nome: 'Quinta-feira' },
      { id: 5, nome: 'Sexta-feira' }
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      await loadOptions();
    });

    async function loadOptions() {
      try {
        const [turmas, disciplinas, professores] = await Promise.all([
          api.get('/turmas').catch(() => []),
          api.get('/disciplinas').catch(() => []),
          api.get('/professores').catch(() => [])
        ]);

        turmasList = turmas;
        disciplinasList = disciplinas;
        professoresList = professores;

        const select = document.getElementById('select-turma');
        select.innerHTML = '<option value="">Selecione uma turma...</option>' +
          turmasList.map(t => `<option value="${t.id}">${t.nome} (${t.anoLetivo})</option>`).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function loadGradeTurma() {
      const turmaId = document.getElementById('select-turma').value;
      const container = document.getElementById('grade-container');

      if (!turmaId) {
        container.innerHTML = UI.renderEmptyState('Nenhuma turma selecionada', 'Selecione uma turma acima para visualizar a grade semanal.');
        return;
      }

      container.innerHTML = UI.renderLoading('Carregando grade horária...');

      try {
        const horarios = await api.get(`/horarios/turma/${turmaId}`);

        if (!horarios || horarios.length === 0) {
          container.innerHTML = UI.renderEmptyState('Sem aulas cadastradas', 'Esta turma ainda não possui horários cadastrados.');
          return;
        }

        // Organiza por dia da semana
        let gridHtml = `
          <div class="table-responsive">
            <table class="schedule-table">
              <thead>
                <tr>
                  ${DIAS_SEMANA.map(d => `<th>${d.nome}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                <tr>
                  ${DIAS_SEMANA.map(d => {
                    const aulasDia = horarios.filter(h => Number(h.diaSemana) === d.id);
                    aulasDia.sort((a, b) => a.horaInicio.localeCompare(b.horaInicio));

                    return `
                      <td>
                        ${aulasDia.length === 0 ? '<div style="color: var(--text-light); text-align: center; font-size: 0.8rem; padding: 1rem;">Sem aula</div>' : ''}
                        ${aulasDia.map(h => {
                          const disc = disciplinasList.find(disc => disc.id === h.disciplinaId) || h.disciplina || { nome: 'Disciplina' };
                          const prof = professoresList.find(p => p.id === h.professorId) || h.professor || { nome: 'Prof.' };
                          return `
                            <div class="schedule-item" style="margin-bottom: 0.5rem;">
                              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <span class="subject">${disc.nome || h.disciplinaNome}</span>
                                <button class="btn btn-sm btn-danger" style="padding: 0 4px; font-size: 0.65rem;" title="Excluir" onclick="excluirHorario('${h.id}')">✕</button>
                              </div>
                              <div class="detail">⏰ ${h.horaInicio} - ${h.horaFim}</div>
                              <div class="detail">👨‍🏫 ${prof.nome || h.professorNome}</div>
                            </div>
                          `;
                        }).join('')}
                      </td>
                    `;
                  }).join('')}
                </tr>
              </tbody>
            </table>
          </div>
        `;

        container.innerHTML = gridHtml;
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar o horário da turma.');
      }
    }

    function openAddHorarioModal() {
      const selectedTurmaId = document.getElementById('select-turma').value;

      if (!selectedTurmaId) {
        UI.toast('Selecione uma turma na tela antes de adicionar um horário!', 'warning');
        return;
      }

      const formHtml = `
        <form id="form-horario">
          <div class="form-group">
            <label>Turma</label>
            <select id="h-turma" class="form-select" disabled>
              ${turmasList.map(t => `<option value="${t.id}" ${t.id === selectedTurmaId ? 'selected' : ''}>${t.nome}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Dia da Semana <span class="required">*</span></label>
            <select id="h-dia" class="form-select" required>
              ${DIAS_SEMANA.map(d => `<option value="${d.id}">${d.nome}</option>`).join('')}
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Hora Início (HH:mm) <span class="required">*</span></label>
              <input type="time" id="h-inicio" class="form-control" value="07:30" required>
            </div>
            <div class="form-group">
              <label>Hora Fim (HH:mm) <span class="required">*</span></label>
              <input type="time" id="h-fim" class="form-control" value="08:20" required>
            </div>
          </div>
          <div class="form-group">
            <label>Disciplina <span class="required">*</span></label>
            <select id="h-disciplina" class="form-select" required>
              <option value="">Selecione...</option>
              ${disciplinasList.map(d => `<option value="${d.id}">${d.nome}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Professor <span class="required">*</span></label>
            <select id="h-professor" class="form-select" required>
              <option value="">Selecione...</option>
              ${professoresList.map(p => `<option value="${p.id}">${p.nome}</option>`).join('')}
            </select>
          </div>
        </form>
      `;

      UI.modal({
        title: 'Adicionar Aula na Grade',
        content: formHtml,
        actions: [
          { label: 'Cancelar', class: 'btn-secondary', onClick: () => UI.closeModal() },
          {
            label: 'Salvar Aula',
            class: 'btn-primary',
            onClick: async () => {
              const body = {
                turmaId: selectedTurmaId,
                diaSemana: Number(document.getElementById('h-dia').value),
                horaInicio: document.getElementById('h-inicio').value,
                horaFim: document.getElementById('h-fim').value,
                disciplinaId: document.getElementById('h-disciplina').value,
                professorId: document.getElementById('h-professor').value
              };

              if (!body.diaSemana || !body.horaInicio || !body.horaFim || !body.disciplinaId || !body.professorId) {
                UI.toast('Preencha todos os campos do horário!', 'warning');
                return;
              }

              try {
                await api.post('/horarios', body);
                UI.toast('Aula adicionada com sucesso!', 'success');
                UI.closeModal();
                loadGradeTurma();
              } catch (err) {
                // Trata RN-06 Erro de conflito de horário (409 CONFLITO) sem recarregar
                if (err.status === 409) {
                  UI.toast(err.message || 'Conflito de horário! O professor ou a turma já possui aula nesse horário.', 'error', 6000);
                }
              }
            }
          }
        ]
      });
    }

    function excluirHorario(id) {
      UI.confirm({
        title: 'Excluir Aula',
        message: 'Deseja realmente remover esta aula da grade?',
        onConfirm: async () => {
          try {
            await api.delete(`/horarios/${id}`);
            UI.toast('Aula removida!', 'success');
            loadGradeTurma();
          } catch (e) {}
        }
      });
    }
  </script>
</body>
</html>
