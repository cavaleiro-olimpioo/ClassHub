<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Professores - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Gerenciamento de Professores</h1>
            <p class="page-subtitle">Cadastro e gerenciamento do corpo docente</p>
          </div>
          <button class="btn btn-primary" onclick="openProfessorModal()">
            ➕ Novo Professor
          </button>
        </div>

        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadProfessores();
    });

    async function loadProfessores() {
      const container = document.getElementById('table-container');
      container.innerHTML = UI.renderLoading('Carregando professores...');

      try {
        const professores = await api.get('/professores');

        const columns = [
          { key: 'nome', label: 'Nome Completo' },
          { key: 'email', label: 'E-mail' },
          {
            key: 'acoes',
            label: 'Ações',
            render: (_, row) => `
              <div class="table-actions">
                <button class="btn btn-sm btn-secondary" onclick="openProfessorModal('${row.id}', '${row.nome}', '${row.email}')">✏️ Editar</button>
              </div>
            `
          }
        ];

        container.innerHTML = UI.renderTable(columns, professores, 'Nenhum professor cadastrado.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro ao carregar', 'Não foi possível carregar a lista de professores.');
      }
    }

    function openProfessorModal(id = null, nome = '', email = '') {
      const formHtml = `
        <form id="form-professor">
          <div class="form-group">
            <label>Nome Completo <span class="required">*</span></label>
            <input type="text" id="prof-nome" class="form-control" value="${nome}" required>
          </div>
          <div class="form-group">
            <label>E-mail <span class="required">*</span></label>
            <input type="email" id="prof-email" class="form-control" value="${email}" required>
          </div>
        </form>
      `;

      UI.modal({
        title: id ? 'Editar Professor' : 'Novo Professor',
        content: formHtml,
        actions: [
          { label: 'Cancelar', class: 'btn-secondary', onClick: () => UI.closeModal() },
          {
            label: 'Salvar',
            class: 'btn-primary',
            onClick: async () => {
              const body = {
                nome: document.getElementById('prof-nome').value.trim(),
                email: document.getElementById('prof-email').value.trim()
              };

              if (!body.nome || !body.email) {
                UI.toast('Preencha todos os campos obrigatórios!', 'warning');
                return;
              }

              try {
                if (id) {
                  await api.put(`/professores/${id}`, body);
                  UI.toast('Professor atualizado com sucesso!', 'success');
                } else {
                  await api.post('/professores', body);
                  UI.toast('Professor cadastrado com sucesso!', 'success');
                }
                UI.closeModal();
                loadProfessores();
              } catch (e) {}
            }
          }
        ]
      });
    }
  </script>
</body>
</html>
