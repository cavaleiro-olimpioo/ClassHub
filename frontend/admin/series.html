<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Séries - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Gerenciamento de Séries</h1>
            <p class="page-subtitle">Séries do ensino fundamental (1º ao 9º ano)</p>
          </div>
          <button class="btn btn-primary" onclick="openSerieModal()">
            ➕ Nova Série
          </button>
        </div>

        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadSeries();
    });

    async function loadSeries() {
      const container = document.getElementById('table-container');
      container.innerHTML = UI.renderLoading('Carregando séries...');

      try {
        const series = await api.get('/series');

        const columns = [
          { key: 'nome', label: 'Nome da Série' },
          { key: 'nivel', label: 'Nível / Etapa' }
        ];

        container.innerHTML = UI.renderTable(columns, series, 'Nenhuma série cadastrada.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro ao carregar', 'Não foi possível carregar as séries.');
      }
    }

    function openSerieModal() {
      const formHtml = `
        <form id="form-serie">
          <div class="form-group">
            <label>Nome da Série <span class="required">*</span></label>
            <input type="text" id="serie-nome" class="form-control" placeholder="Ex: 5º Ano A" required>
          </div>
          <div class="form-group">
            <label>Nível <span class="required">*</span></label>
            <input type="text" id="serie-nivel" class="form-control" placeholder="Ex: Ensino Fundamental I" required>
          </div>
        </form>
      `;

      UI.modal({
        title: 'Nova Série',
        content: formHtml,
        actions: [
          { label: 'Cancelar', class: 'btn-secondary', onClick: () => UI.closeModal() },
          {
            label: 'Salvar',
            class: 'btn-primary',
            onClick: async () => {
              const body = {
                nome: document.getElementById('serie-nome').value.trim(),
                nivel: document.getElementById('serie-nivel').value.trim()
              };

              if (!body.nome || !body.nivel) {
                UI.toast('Preencha todos os campos obrigatórios!', 'warning');
                return;
              }

              try {
                await api.post('/series', body);
                UI.toast('Série cadastrada com sucesso!', 'success');
                UI.closeModal();
                loadSeries();
              } catch (e) {}
            }
          }
        ]
      });
    }
  </script>
</body>
</html>
