<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turmas & Vínculos - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    .tab-buttons {
      display: flex;
      gap: var(--space-2);
      border-bottom: 2px solid var(--border-color);
      margin-bottom: var(--space-6);
    }
    .tab-btn {
      padding: var(--space-3) var(--space-6);
      background: none;
      border: none;
      font-size: var(--font-size-base);
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: var(--primary-500);
      border-bottom-color: var(--primary-500);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Gestão de Turmas & Vínculos</h1>
            <p class="page-subtitle">Cadastro de turmas e atribuição de professores a turmas/disciplinas</p>
          </div>
        </div>

        <div class="tab-buttons">
          <button class="tab-btn active" onclick="switchTab('turmas')">🏫 Turmas</button>
          <button class="tab-btn" onclick="switchTab('vinculos')">🔗 Vínculos (Prof. → Disc. → Turma)</button>
        </div>

        <!-- Aba Turmas -->
        <div id="tab-turmas" class="tab-content active">
          <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
            <button class="btn btn-primary" onclick="openTurmaModal()">➕ Nova Turma</button>
          </div>
          <div id="turmas-table-container"></div>
        </div>

        <!-- Aba Vínculos -->
        <div id="tab-vinculos" class="tab-content">
          <div class="card" style="margin-bottom: 1.5rem;">
            <div class="card-header">
              <h2 class="card-title">Atribuir Professor a Turma e Disciplina</h2>
            </div>
            <form id="form-vinculo" onsubmit="salvarVinculo(event)">
              <div class="form-row">
                <div class="form-group">
                  <label>Professor <span class="required">*</span></label>
                  <select id="v-professor" class="form-select" required></select>
                </div>
                <div class="form-group">
                  <label>Turma <span class="required">*</span></label>
                  <select id="v-turma" class="form-select" required></select>
                </div>
                <div class="form-group">
                  <label>Disciplina <span class="required">*</span></label>
                  <select id="v-disciplina" class="form-select" required></select>
                </div>
                <div class="form-group">
                  <label>Ano Letivo <span class="required">*</span></label>
                  <input type="number" id="v-ano" class="form-control" value="2025" required>
                </div>
              </div>
              <div style="display: flex; justify-content: flex-end;">
                <button type="submit" class="btn btn-success">➕ Adicionar Vínculo</button>
              </div>
            </form>
          </div>

          <div id="vinculos-table-container"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    let seriesList = [];
    let turmasList = [];
    let professoresList = [];
    let disciplinasList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await loadInitialData();
    });

    async function loadInitialData() {
      try {
        const [series, turmas, professores, disciplinas] = await Promise.all([
          api.get('/series').catch(() => []),
          api.get('/turmas').catch(() => []),
          api.get('/professores').catch(() => []),
          api.get('/disciplinas').catch(() => [])
        ]);

        seriesList = series;
        turmasList = turmas;
        professoresList = professores;
        disciplinasList = disciplinas;

        loadTurmas();
        populateVinculoSelects();
        loadVinculos();
      } catch (err) {
        console.error(err);
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'turmas') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-turmas').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-vinculos').classList.add('active');
      }
    }

    function loadTurmas() {
      const container = document.getElementById('turmas-table-container');

      const columns = [
        { key: 'nome', label: 'Nome da Turma' },
        {
          key: 'serie',
          label: 'Série',
          render: (val, row) => {
            if (val && val.nome) return val.nome;
            const found = seriesList.find(s => s.id === row.serieId);
            return found ? found.nome : '-';
          }
        },
        { key: 'anoLetivo', label: 'Ano Letivo' },
        {
          key: 'acoes',
          label: 'Ações',
          render: (_, row) => `
            <button class="btn btn-sm btn-secondary" onclick="openTurmaModal('${row.id}')">✏️ Editar</button>
          `
        }
      ];

      container.innerHTML = UI.renderTable(columns, turmasList, 'Nenhuma turma encontrada.');
    }

    function openTurmaModal(id = null) {
      const turma = id ? turmasList.find(t => t.id === id) : { nome: '', serieId: '', anoLetivo: new Date().getFullYear() };

      const seriesOptions = seriesList.map(s =>
        `<option value="${s.id}" ${turma.serieId === s.id ? 'selected' : ''}>${s.nome}</option>`
      ).join('');

      const formHtml = `
        <form id="form-turma">
          <div class="form-group">
            <label>Nome da Turma <span class="required">*</span></label>
            <input type="text" id="t-nome" class="form-control" value="${turma.nome}" placeholder="Ex: Turma A" required>
          </div>
          <div class="form-group">
            <label>Série <span class="required">*</span></label>
            <select id="t-serie" class="form-select" required>
              <option value="">Selecione uma série...</option>
              ${seriesOptions}
            </select>
          </div>
          <div class="form-group">
            <label>Ano Letivo <span class="required">*</span></label>
            <input type="number" id="t-ano" class="form-control" value="${turma.anoLetivo}" required>
          </div>
        </form>
      `;

      UI.modal({
        title: id ? 'Editar Turma' : 'Nova Turma',
        content: formHtml,
        actions: [
          { label: 'Cancelar', class: 'btn-secondary', onClick: () => UI.closeModal() },
          {
            label: 'Salvar',
            class: 'btn-primary',
            onClick: async () => {
              const body = {
                nome: document.getElementById('t-nome').value.trim(),
                serieId: document.getElementById('t-serie').value,
                anoLetivo: Number(document.getElementById('t-ano').value)
              };

              if (!body.nome || !body.serieId || !body.anoLetivo) {
                UI.toast('Preencha todos os campos obrigatórios!', 'warning');
                return;
              }

              try {
                if (id) {
                  await api.put(`/turmas/${id}`, body);
                  UI.toast('Turma atualizada!', 'success');
                } else {
                  await api.post('/turmas', body);
                  UI.toast('Turma criada!', 'success');
                }
                UI.closeModal();
                const updated = await api.get('/turmas');
                turmasList = updated;
                loadTurmas();
                populateVinculoSelects();
              } catch (e) {}
            }
          }
        ]
      });
    }

    function populateVinculoSelects() {
      const pSel = document.getElementById('v-professor');
      pSel.innerHTML = '<option value="">Selecione um Professor...</option>' + profesoresList.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');

      const tSel = document.getElementById('v-turma');
      tSel.innerHTML = '<option value="">Selecione uma Turma...</option>' + turmasList.map(t => `<option value="${t.id}">${t.nome} (${t.anoLetivo})</option>`).join('');

      const dSel = document.getElementById('v-disciplina');
      dSel.innerHTML = '<option value="">Selecione uma Disciplina...</option>' + disciplinasList.map(d => `<option value="${d.id}">${d.nome}</option>`).join('');
    }

    async function loadVinculos() {
      const container = document.getElementById('vinculos-table-container');
      container.innerHTML = UI.renderLoading('Carregando vínculos...');

      try {
        const vinculos = await api.get('/vinculos');

        const columns = [
          {
            key: 'professor',
            label: 'Professor',
            render: (val, row) => {
              if (val && val.nome) return val.nome;
              const found = professoresList.find(p => p.id === row.professorId);
              return found ? found.nome : '-';
            }
          },
          {
            key: 'turma',
            label: 'Turma',
            render: (val, row) => {
              if (val && val.nome) return val.nome;
              const found = turmasList.find(t => t.id === row.turmaId);
              return found ? found.nome : '-';
            }
          },
          {
            key: 'disciplina',
            label: 'Disciplina',
            render: (val, row) => {
              if (val && val.nome) return val.nome;
              const found = disciplinasList.find(d => d.id === row.disciplinaId);
              return found ? found.nome : '-';
            }
          },
          { key: 'anoLetivo', label: 'Ano Letivo' },
          {
            key: 'acoes',
            label: 'Ações',
            render: (_, row) => `
              <button class="btn btn-sm btn-danger" onclick="excluirVinculo('${row.id}')">🗑️ Remover</button>
            `
          }
        ];

        container.innerHTML = UI.renderTable(columns, vinculos, 'Nenhum vínculo cadastrado.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar a lista de vínculos.');
      }
    }

    async function salvarVinculo(e) {
      e.preventDefault();
      const body = {
        professorId: document.getElementById('v-professor').value,
        turmaId: document.getElementById('v-turma').value,
        disciplinaId: document.getElementById('v-disciplina').value,
        anoLetivo: Number(document.getElementById('v-ano').value)
      };

      if (!body.professorId || !body.turmaId || !body.disciplinaId || !body.anoLetivo) {
        UI.toast('Selecione todos os campos do vínculo!', 'warning');
        return;
      }

      try {
        await api.post('/vinculos', body);
        UI.toast('Vínculo criado com sucesso!', 'success');
        document.getElementById('form-vinculo').reset();
        loadVinculos();
      } catch (err) {}
    }

    function excluirVinculo(id) {
      UI.confirm({
        title: 'Remover Vínculo',
        message: 'Tem certeza que deseja remover esta associação de professor e disciplina?',
        onConfirm: async () => {
          try {
            await api.delete(`/vinculos/${id}`);
            UI.toast('Vínculo removido!', 'success');
            loadVinculos();
          } catch (e) {}
        }
      });
    }
  </script>
</body>
</html>
