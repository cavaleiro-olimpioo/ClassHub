<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achados e Perdidos - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Mural de Achados e Perdidos</h1>
            <p class="page-subtitle">Consulte os objetos e pertences encontrados nas dependências da escola</p>
          </div>
        </div>

        <!-- Filtros -->
        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="filter-categoria">Categoria</label>
              <select id="filter-categoria" class="form-select">
                <option value="">Todas as Categorias</option>
                <option value="UNIFORME">Uniforme</option>
                <option value="MATERIAL">Material Escolar</option>
                <option value="ELETRONICO">Eletrônicos</option>
                <option value="OUTRO">Outros</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="filter-status">Status</label>
              <select id="filter-status" class="form-select">
                <option value="">Todos os Status</option>
                <option value="NAO_REIVINDICADO">Não Reivindicado</option>
                <option value="DEVOLVIDO">Devolvido</option>
              </select>
            </div>
            <div>
              <button class="btn btn-secondary" onclick="loadItens()">🔍 Filtrar</button>
            </div>
          </div>
        </div>

        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadItens();
    });

    async function loadItens() {
      const container = document.getElementById('table-container');
      container.innerHTML = UI.renderLoading('Carregando itens de achados e perdidos...');

      const cat = document.getElementById('filter-categoria').value;
      const status = document.getElementById('filter-status').value;

      let params = [];
      if (cat) params.push(`categoria=${encodeURIComponent(cat)}`);
      if (status) params.push(`status=${encodeURIComponent(status)}`);
      const query = params.length ? `?${params.join('&')}` : '';

      try {
        const response = await api.get(`/achados-perdidos${query}`);
        const itens = Array.isArray(response) ? response : (response.content || []);

        const columns = [
          { key: 'descricao', label: 'Descrição do Objeto' },
          { key: 'categoria', label: 'Categoria' },
          { key: 'localEncontrado', label: 'Local onde foi encontrado' },
          { key: 'data', label: 'Data', render: (val) => UI.formatDate(val) },
          { key: 'status', label: 'Status', render: (val) => UI.badge(val) }
        ];

        container.innerHTML = UI.renderTable(columns, itens, 'Nenhum objeto de achados e perdidos registrado com os filtros informados.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar a lista de achados e perdidos.');
      }
    }
  </script>
</body>
</html>
