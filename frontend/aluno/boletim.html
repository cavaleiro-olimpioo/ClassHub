<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Boletim Escolar - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Boletim Escolar Bimestral</h1>
            <p class="page-subtitle">Consolidado de médias e situação final por disciplina</p>
          </div>
        </div>

        <!-- Filtro Bimestre e Download -->
        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="select-bimestre">Selecione o Bimestre</label>
              <select id="select-bimestre" class="form-select">
                <option value="1">1º Bimestre</option>
                <option value="2">2º Bimestre</option>
                <option value="3">3º Bimestre</option>
                <option value="4">4º Bimestre</option>
              </select>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-primary" onclick="carregarBoletim()">📋 Visualizar Boletim</button>
              <button class="btn btn-success" onclick="baixarPdfBoletim()">📄 Baixar PDF</button>
            </div>
          </div>
        </div>

        <div id="boletim-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await carregarBoletim();
    });

    async function carregarBoletim() {
      const session = Auth.getSession();
      const alunoId = session ? session.vinculoId : null;
      const bimestre = document.getElementById('select-bimestre').value;
      const container = document.getElementById('boletim-container');

      if (!alunoId) {
        container.innerHTML = UI.renderEmptyState('Sem dados do aluno', 'Sessão do aluno não encontrada.');
        return;
      }

      container.innerHTML = UI.renderLoading('Buscando boletim...');

      try {
        const response = await api.get(`/boletins/aluno/${alunoId}?bimestre=${bimestre}`);

        const itens = Array.isArray(response) ? response : (response.disciplinas || response.itens || [response]);

        if (!itens || itens.length === 0) {
          container.innerHTML = UI.renderEmptyState('Nenhum dado encontrado', 'Não há registros lançados para este bimestre.');
          return;
        }

        const columns = [
          { key: 'disciplinaNome', label: 'Disciplina', render: (val, r) => val || r.disciplina?.nome || `Disciplina ${r.disciplinaId}` },
          { key: 'media', label: 'Média Bimestral', render: (val) => `<strong>${UI.formatGrade(val)}</strong>` },
          { key: 'frequencia', label: 'Frequência (%)', render: (val) => val !== undefined ? `${val}%` : '-' },
          {
            key: 'situacao',
            label: 'Situação',
            render: (val, r) => {
              // RN-02 Aprovação: Média >= 6.00 E Frequência >= 75%
              if (val) return UI.badge(val);
              const media = r.media !== undefined ? r.media : 0;
              const freq = r.frequencia !== undefined ? r.frequencia : 100;
              if (media >= 6.0 && freq >= 75) return UI.badge('APROVADO');
              if (media >= 4.0 && freq >= 75) return UI.badge('RECUPERACAO');
              return UI.badge('REPROVADO');
            }
          }
        ];

        container.innerHTML = UI.renderTable(columns, itens, 'Sem itens no boletim.');
      } catch (err) {
        // RN-05 Tratamento de bimestre ainda não fechado
        if (err.status === 422 || (err.data && err.data.erro === 'REGRA_NEGOCIO')) {
          container.innerHTML = `
            <div class="card" style="text-align: center; padding: 3rem;">
              <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
              <h2 style="color: var(--primary-800); margin-bottom: 0.5rem;">Bimestre ainda não fechado</h2>
              <p style="color: var(--text-muted);">As notas e médias deste bimestre ainda estão em fase de lançamento pelos professores e conferência da secretaria.</p>
            </div>
          `;
        } else {
          container.innerHTML = UI.renderEmptyState('Erro ao carregar', err.message || 'Não foi possível carregar o boletim.');
        }
      }
    }

    async function baixarPdfBoletim() {
      const session = Auth.getSession();
      const alunoId = session ? session.vinculoId : null;
      const bimestre = document.getElementById('select-bimestre').value;

      if (!alunoId) return;

      UI.toast('Iniciando download do PDF do boletim...', 'info');
      await api.downloadPdf(`/boletins/aluno/${alunoId}/pdf?bimestre=${bimestre}`, `boletim_${bimestre}bimestre.pdf`);
    }
  </script>
</body>
</html>
