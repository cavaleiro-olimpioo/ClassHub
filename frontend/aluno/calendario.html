<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário Escolar - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Calendário Escolar</h1>
            <p class="page-subtitle">Dias letivos, feriados, recessos e atividades agendadas</p>
          </div>
        </div>

        <!-- Filtros -->
        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="filter-ano">Ano Letivo</label>
              <input type="number" id="filter-ano" class="form-control" value="2025">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="filter-mes">Mês (Opcional)</label>
              <select id="filter-mes" class="form-select">
                <option value="">Todos os meses</option>
                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
              </select>
            </div>
            <div>
              <button class="btn btn-secondary" onclick="loadCalendario()">🔍 Filtrar</button>
            </div>
          </div>
        </div>

        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('filter-ano').value = new Date().getFullYear();
      await loadCalendario();
    });

    async function loadCalendario() {
      const container = document.getElementById('table-container');
      container.innerHTML = UI.renderLoading('Carregando calendário escolar...');

      const ano = document.getElementById('filter-ano').value;
      const mes = document.getElementById('filter-mes').value;

      let query = `?anoLetivo=${ano}`;
      if (mes) query += `&mes=${mes}`;

      try {
        const eventos = await api.get(`/calendario${query}`);

        const columns = [
          { key: 'data', label: 'Data', render: (val) => UI.formatDate(val) },
          { key: 'titulo', label: 'Evento / Descrição' },
          { key: 'tipo', label: 'Tipo', render: (val) => UI.badge(val) },
          { key: 'descricao', label: 'Observações' }
        ];

        container.innerHTML = UI.renderTable(columns, eventos, 'Nenhum registro encontrado no calendário escolar.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar as informações do calendário escolar.');
      }
    }
  </script>
</body>
</html>
