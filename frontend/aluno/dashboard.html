<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Aluno - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Área do Aluno</h1>
            <p class="page-subtitle">Bem-vindo ao seu portal de acompanhamento escolar</p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">📊</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-frequencia">-%</div>
              <div class="stat-label">Frequência Geral</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">❌</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-faltas">-</div>
              <div class="stat-label">Total de Faltas</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">⚠️</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-ocorrencias">-</div>
              <div class="stat-label">Minhas Ocorrências</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Atalhos do Estudante</h2>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
            <a href="boletim.html" class="btn btn-secondary" style="padding: 1rem; text-align: center; flex-direction: column;">
              <span style="font-size: 1.5rem;">📄</span>
              <span>Meu Boletim</span>
            </a>
            <a href="notas.html" class="btn btn-secondary" style="padding: 1rem; text-align: center; flex-direction: column;">
              <span style="font-size: 1.5rem;">📝</span>
              <span>Minhas Notas</span>
            </a>
            <a href="faltas.html" class="btn btn-secondary" style="padding: 1rem; text-align: center; flex-direction: column;">
              <span style="font-size: 1.5rem;">❌</span>
              <span>Minhas Faltas</span>
            </a>
            <a href="horarios.html" class="btn btn-secondary" style="padding: 1rem; text-align: center; flex-direction: column;">
              <span style="font-size: 1.5rem;">⏰</span>
              <span>Grade de Aulas</span>
            </a>
            <a href="calendario.html" class="btn btn-secondary" style="padding: 1rem; text-align: center; flex-direction: column;">
              <span style="font-size: 1.5rem;">📅</span>
              <span>Calendário Escolar</span>
            </a>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Próximos Eventos do Calendário</h2>
          </div>
          <div id="eventos-container"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = Auth.getSession();
      const alunoId = session ? session.vinculoId : null;

      if (alunoId) {
        try {
          const [presencas, ocorrencias] = await Promise.all([
            api.get(`/presencas?alunoId=${alunoId}`).catch(() => []),
            api.get(`/ocorrencias?alunoId=${alunoId}`).catch(() => [])
          ]);

          const totalRegistros = Array.isArray(presencas) ? presencas.length : 0;
          const totalFaltas = Array.isArray(presencas) ? presencas.filter(p => p.status === 'FALTA').length : 0;
          const totalPresentes = Array.isArray(presencas) ? presencas.filter(p => p.status === 'PRESENTE' || p.status === 'FALTA_JUSTIFICADA').length : 0;

          const pct = totalRegistros > 0 ? Math.round((totalPresentes / totalRegistros) * 100) : 100;

          document.getElementById('stat-frequencia').textContent = `${pct}%`;
          document.getElementById('stat-faltas').textContent = totalFaltas;
          document.getElementById('stat-ocorrencias').textContent = Array.isArray(ocorrencias) ? ocorrencias.length : 0;
        } catch (e) {}
      }

      // Carrega próximos eventos do calendário
      try {
        const anoAtual = new Date().getFullYear();
        const eventos = await api.get(`/calendario?anoLetivo=${anoAtual}`).catch(() => []);

        if (!eventos || eventos.length === 0) {
          document.getElementById('eventos-container').innerHTML = UI.renderEmptyState('Sem eventos', 'Nenhum evento futuro no calendário escolar.');
        } else {
          const columns = [
            { key: 'data', label: 'Data', render: (val) => UI.formatDate(val) },
            { key: 'titulo', label: 'Evento' },
            { key: 'tipo', label: 'Tipo', render: (val) => UI.badge(val) },
            { key: 'descricao', label: 'Descrição' }
          ];
          document.getElementById('eventos-container').innerHTML = UI.renderTable(columns, eventos.slice(0, 5));
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
