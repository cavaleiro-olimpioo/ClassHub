<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Faltas - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Relatório de Frequência e Faltas</h1>
            <p class="page-subtitle">Acompanhamento percentual de presença por disciplina (mínimo exigido: 75%)</p>
          </div>
        </div>

        <div id="faltas-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadFaltasAluno();
    });

    async function loadFaltasAluno() {
      const session = Auth.getSession();
      const alunoId = session ? session.vinculoId : null;
      const container = document.getElementById('faltas-container');

      if (!alunoId) {
        container.innerHTML = UI.renderEmptyState('Sem dados de estudante', 'Identificação do aluno não localizada.');
        return;
      }

      container.innerHTML = UI.renderLoading('Carregando registros de presenças e faltas...');

      try {
        const presencas = await api.get(`/presencas?alunoId=${alunoId}`);

        if (!presencas || presencas.length === 0) {
          container.innerHTML = UI.renderEmptyState('Sem chamadas registradas', 'Ainda não há registros de presença/falta lançados para você.');
          return;
        }

        // Agrupa registros por disciplina
        const porDisciplina = {};

        presencas.forEach(p => {
          const discNome = p.disciplinaNome || p.disciplina?.nome || `Disciplina ${p.disciplinaId || 'Geral'}`;

          if (!porDisciplina[discNome]) {
            porDisciplina[discNome] = {
              aulasDadas: 0,
              faltas: 0,
              faltasJustificadas: 0,
              presencas: 0
            };
          }

          porDisciplina[discNome].aulasDadas += 1;

          if (p.status === 'FALTA') {
            porDisciplina[discNome].faltas += 1;
          } else if (p.status === 'FALTA_JUSTIFICADA') {
            porDisciplina[discNome].faltasJustificadas += 1;
          } else {
            porDisciplina[discNome].presencas += 1;
          }
        });

        // Constrói cards de frequência por disciplina
        let cardRows = Object.keys(porDisciplina).map(discNome => {
          const item = porDisciplina[discNome];
          const presencasEfetivas = item.presencas + item.faltasJustificadas;
          const freqPct = item.aulasDadas > 0 ? Math.round((presencasEfetivas / item.aulasDadas) * 100) : 100;
          const isOk = freqPct >= 75;

          return `
            <div class="card" style="margin-bottom: 1rem;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--primary-900);">${discNome}</h3>
                <span class="badge ${isOk ? 'badge-success' : 'badge-danger'}" style="font-size: 0.9rem;">
                  ${freqPct}% de Frequência
                </span>
              </div>

              <!-- Barra visual de progresso -->
              <div class="progress-bar-bg" style="margin-bottom: 0.75rem;">
                <div class="progress-bar-fill ${isOk ? 'progress-success' : 'progress-danger'}" style="width: ${freqPct}%;"></div>
              </div>

              <div style="display: flex; gap: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
                <div><strong>Aulas Dadas:</strong> ${item.aulasDadas}</div>
                <div><strong>Presenças:</strong> ${item.presencas}</div>
                <div><strong style="color: var(--color-danger);">Faltas:</strong> ${item.faltas}</div>
                <div><strong style="color: var(--color-warning);">Faltas Justificadas:</strong> ${item.faltasJustificadas}</div>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = cardRows;
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar as informações de frequência.');
      }
    }
  </script>
</body>
</html>
