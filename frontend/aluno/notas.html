<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Notas - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Minhas Notas e Avaliações</h1>
            <p class="page-subtitle">Histórico completo de avaliações lançadas pelos professores</p>
          </div>
        </div>

        <div id="notas-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadNotasAluno();
    });

    async function loadNotasAluno() {
      const session = Auth.getSession();
      const alunoId = session ? session.vinculoId : null;
      const container = document.getElementById('notas-container');

      if (!alunoId) {
        container.innerHTML = UI.renderEmptyState('Sem dados de estudante', 'Identificação do aluno não localizada na sessão.');
        return;
      }

      container.innerHTML = UI.renderLoading('Carregando suas notas...');

      try {
        const notas = await api.get(`/notas/aluno/${alunoId}`);

        if (!notas || notas.length === 0) {
          container.innerHTML = UI.renderEmptyState('Nenhuma nota lançada', 'Você ainda não possui notas cadastradas no sistema.');
          return;
        }

        const columns = [
          {
            key: 'disciplinaNome',
            label: 'Disciplina',
            render: (val, r) => val || r.disciplina?.nome || `Disciplina ${r.disciplinaId}`
          },
          {
            key: 'bimestre',
            label: 'Bimestre',
            render: (val) => `${val}º Bimestre`
          },
          { key: 'tipo', label: 'Tipo de Avaliação' },
          { key: 'peso', label: 'Peso' },
          {
            key: 'valor',
            label: 'Nota Obtida',
            render: (val) => `<strong>${UI.formatGrade(val)}</strong>`
          }
        ];

        container.innerHTML = UI.renderTable(columns, notas, 'Sem notas lançadas.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar suas notas.');
      }
    }
  </script>
</body>
</html>
