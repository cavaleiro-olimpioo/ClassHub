<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClassHub - Sistema de gerenciamento escolar" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ClassHub - Gestão Escolar</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('classhub-theme');
        const theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>

    <link rel="stylesheet" crossorigin href="/assets/index-C2ZH2tHS.css">
