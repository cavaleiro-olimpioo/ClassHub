<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Alunos - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Consulta de Alunos</h1>
            <p class="page-subtitle">Visualização de ficha individual (notas, frequências e ocorrências)</p>
          </div>
        </div>

        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="select-turma">Filtrar por Turma</label>
              <select id="select-turma" class="form-select">
                <option value="">Todas as Turmas</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="input-busca">Buscar por Nome</label>
              <input type="text" id="input-busca" class="form-control" placeholder="Digite o nome do aluno...">
            </div>
            <div>
              <button class="btn btn-secondary" onclick="carregarAlunos()">🔍 Buscar</button>
            </div>
          </div>
        </div>

        <div id="alunos-list-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadTurmasSelect();
      await carregarAlunos();
    });

    async function loadTurmasSelect() {
      try {
        const turmas = await api.get('/turmas').catch(() => []);
        const select = document.getElementById('select-turma');
        select.innerHTML = '<option value="">Todas as Turmas</option>';
        turmas.forEach(t => {
          select.innerHTML += `<option value="${t.id}">${t.nome}</option>`;
        });
      } catch (e) {}
    }

    async function carregarAlunos() {
      const container = document.getElementById('alunos-list-container');
      container.innerHTML = UI.renderLoading('Carregando lista de alunos...');

      const turmaId = document.getElementById('select-turma').value;
      const nome = document.getElementById('input-busca').value.trim();

      let params = [];
      if (turmaId) params.push(`turmaId=${encodeURIComponent(turmaId)}`);
      if (nome) params.push(`nome=${encodeURIComponent(nome)}`);
      const query = params.length ? `?${params.join('&')}` : '';

      try {
        const alunos = await api.get(`/alunos${query}`);

        const columns = [
          { key: 'matricula', label: 'Matrícula' },
          { key: 'nome', label: 'Nome' },
          { key: 'email', label: 'E-mail' },
          { key: 'turmaNome', label: 'Turma', render: (val, r) => val || r.turma?.nome || '-' },
          {
            key: 'acoes',
            label: 'Ações',
            render: (_, row) => `
              <button class="btn btn-sm btn-primary" onclick="verFichaAluno('${row.id}', '${row.nome.replace(/'/g, "\\'")}')">
                📄 Ver Ficha Completa
              </button>
            `
          }
        ];

        container.innerHTML = UI.renderTable(columns, alunos, 'Nenhum aluno encontrado.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar a lista de alunos.');
      }
    }

    async function verFichaAluno(alunoId, alunoNome) {
      const modalContent = document.createElement('div');
      modalContent.innerHTML = UI.renderLoading('Carregando histórico do aluno...');

      UI.modal({
        title: `Ficha do Aluno: ${alunoNome}`,
        content: modalContent,
        size: 'large'
      });

      try {
        const [notas, presencas, ocorrencias] = await Promise.all([
          api.get(`/notas/aluno/${alunoId}`).catch(() => []),
          api.get(`/presencas?alunoId=${alunoId}`).catch(() => []),
          api.get(`/ocorrencias?alunoId=${alunoId}`).catch(() => [])
        ]);

        const totalFaltas = Array.isArray(presencas) ? presencas.filter(p => p.status === 'FALTA' || p.status === 'FALTA_JUSTIFICADA').length : 0;

        let fichaHtml = `
          <div class="stats-grid" style="margin-bottom: 1.5rem;">
            <div class="stat-card">
              <div class="stat-icon">❌</div>
              <div class="stat-info">
                <div class="stat-value">${totalFaltas}</div>
                <div class="stat-label">Total de Faltas</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">⚠️</div>
              <div class="stat-info">
                <div class="stat-value">${Array.isArray(ocorrencias) ? ocorrencias.length : 0}</div>
                <div class="stat-label">Ocorrências</div>
              </div>
            </div>
          </div>

          <h3 style="font-size: 1.1rem; font-weight: bold; margin-bottom: 0.5rem; color: var(--primary-800);">Histórico de Notas</h3>
          ${UI.renderTable([
            { key: 'disciplinaNome', label: 'Disciplina', render: (val, r) => val || r.disciplina?.nome || '-' },
            { key: 'bimestre', label: 'Bimestre', render: (val) => `${val}º Bimestre` },
            { key: 'tipo', label: 'Avaliação' },
            { key: 'valor', label: 'Nota', render: (val) => UI.formatGrade(val) }
          ], notas, 'Sem notas registradas.')}

          <h3 style="font-size: 1.1rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; color: var(--primary-800);">Ocorrências Registradas</h3>
          ${UI.renderTable([
            { key: 'tipo', label: 'Tipo', render: (val) => UI.badge(val) },
            { key: 'descricao', label: 'Descrição' },
            { key: 'status', label: 'Status', render: (val) => UI.badge(val) }
          ], ocorrencias, 'Sem ocorrências registradas.')}
        `;

        modalContent.innerHTML = fichaHtml;
      } catch (e) {
        modalContent.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar o histórico do aluno.');
      }
    }
  </script>
</body>
</html>
