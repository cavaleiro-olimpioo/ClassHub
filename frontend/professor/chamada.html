<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realizar Chamada - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Lançamento de Frequência (Chamada)</h1>
            <p class="page-subtitle">Selecione a turma, disciplina e data para registrar a presença dos alunos</p>
          </div>
        </div>

        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="select-turma">Turma <span class="required">*</span></label>
              <select id="select-turma" class="form-select" onchange="loadDisciplinasTurma()">
                <option value="">Selecione uma turma...</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="select-disciplina">Disciplina <span class="required">*</span></label>
              <select id="select-disciplina" class="form-select">
                <option value="">Selecione uma disciplina...</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="input-data">Data da Aula <span class="required">*</span></label>
              <input type="date" id="input-data" class="form-control">
            </div>
            <div>
              <button class="btn btn-primary" onclick="carregarListaAlunos()">📋 Carregar Alunos</button>
            </div>
          </div>
        </div>

        <div id="chamada-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    let vinculosProfessor = [];
    let alunosChamada = [];
    let presencasAtuais = {}; // { alunoId: { status: 'PRESENTE'|'FALTA'|'FALTA_JUSTIFICADA', justificativa: '' } }

    document.addEventListener('DOMContentLoaded', async () => {
      // Define a data padrao como hoje
      document.getElementById('input-data').value = new Date().toISOString().split('T')[0];

      await loadVinculosProfessor();

      // Checa parametros de URL
      const urlParams = new URLSearchParams(window.location.search);
      const tId = urlParams.get('turmaId');
      const dId = urlParams.get('disciplinaId');

      if (tId) {
        document.getElementById('select-turma').value = tId;
        loadDisciplinasTurma();
        if (dId) {
          document.getElementById('select-disciplina').value = dId;
          carregarListaAlunos();
        }
      }
    });

    async function loadVinculosProfessor() {
      const session = Auth.getSession();
      const profId = session ? session.vinculoId : null;

      if (!profId) {
        UI.toast('Identificador de professor não localizado.', 'error');
        return;
      }

      try {
        vinculosProfessor = await api.get(`/vinculos?professorId=${profId}`).catch(() => []);

        // Preenche select de turmas únicas vinculadas
        const turmasMap = new Map();
        vinculosProfessor.forEach(v => {
          if (v.turma) {
            turmasMap.set(v.turma.id || v.turmaId, v.turma.nome || `Turma ${v.turmaId}`);
          } else if (v.turmaId) {
            turmasMap.set(v.turmaId, `Turma (${v.turmaId})`);
          }
        });

        const selectTurma = document.getElementById('select-turma');
        selectTurma.innerHTML = '<option value="">Selecione uma turma...</option>';
        turmasMap.forEach((nome, id) => {
          selectTurma.innerHTML += `<option value="${id}">${nome}</option>`;
        });
      } catch (e) {
        console.error(e);
      }
    }

    function loadDisciplinasTurma() {
      const turmaId = document.getElementById('select-turma').value;
      const selectDisc = document.getElementById('select-disciplina');
      selectDisc.innerHTML = '<option value="">Selecione uma disciplina...</option>';

      if (!turmaId) return;

      const vinculosTurma = vinculosProfessor.filter(v => v.turmaId === turmaId || (v.turma && v.turma.id === turmaId));
      vinculosTurma.forEach(v => {
        const discId = v.disciplinaId || (v.disciplina ? v.disciplina.id : null);
        const discNome = v.disciplina ? v.disciplina.nome : `Disciplina ${discId}`;
        selectDisc.innerHTML += `<option value="${discId}">${discNome}</option>`;
      });
    }

    async function carregarListaAlunos() {
      const turmaId = document.getElementById('select-turma').value;
      const disciplinaId = document.getElementById('select-disciplina').value;
      const data = document.getElementById('input-data').value;
      const container = document.getElementById('chamada-container');

      if (!turmaId || !disciplinaId || !data) {
        UI.toast('Selecione a turma, a disciplina e a data!', 'warning');
        return;
      }

      container.innerHTML = UI.renderLoading('Verificando calendário e alunos...');

      try {
        // Valida se o dia é letivo via /calendario (RN-04)
        const anoLetivo = new Date(data).getFullYear();
        const calendario = await api.get(`/calendario?anoLetivo=${anoLetivo}`).catch(() => []);
        const diaCal = Array.isArray(calendario) ? calendario.find(c => c.data === data) : null;

        const isDiaLetivo = !diaCal || diaCal.tipo === 'LETIVO'; // Se não estiver marcado no calendário, assume letivo

        // Busca os alunos da turma
        alunosChamada = await api.get(`/alunos?turmaId=${turmaId}`).catch(() => []);

        if (!alunosChamada || alunosChamada.length === 0) {
          container.innerHTML = UI.renderEmptyState('Nenhum aluno', 'Esta turma não possui alunos matriculados.');
          return;
        }

        // Busca presenças já lançadas para esta turma, disciplina e data
        const presencasSalvas = await api.get(`/presencas?turmaId=${turmaId}&disciplinaId=${disciplinaId}&data=${data}`).catch(() => []);

        // Inicializa estado das presenças (default: PRESENTE se novo)
        presencasAtuais = {};
        alunosChamada.forEach(aluno => {
          const encontrada = Array.isArray(presencasSalvas) ? presencasSalvas.find(p => p.alunoId === aluno.id) : null;
          if (encontrada) {
            presencasAtuais[aluno.id] = {
              id: encontrada.id,
              status: encontrada.status,
              justificativa: encontrada.justificativa || ''
            };
          } else {
            presencasAtuais[aluno.id] = {
              id: null,
              status: 'PRESENTE',
              justificativa: ''
            };
          }
        });

        renderTabelaChamada(isDiaLetivo, diaCal);
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar os dados para a chamada.');
      }
    }

    function renderTabelaChamada(isDiaLetivo, diaCal) {
      const container = document.getElementById('chamada-container');

      let avisoHtml = '';
      if (!isDiaLetivo && diaCal) {
        avisoHtml = `
          <div class="card" style="background-color: var(--color-warning-bg); border-color: var(--color-warning); margin-bottom: 1rem;">
            ⚠️ <strong>Atenção:</strong> A data selecionada (${UI.formatDate(diaCal.data)}) está registrada no calendário como <strong>${diaCal.tipo}</strong> (${diaCal.titulo}). Lançamento desabilitado.
          </div>
        `;
      }

      let tableHtml = `
        ${avisoHtml}
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Lista de Alunos (${alunosChamada.length})</h2>
            <div>
              <button class="btn btn-sm btn-secondary" onclick="marcarTodosPresentes()" ${!isDiaLetivo ? 'disabled' : ''}>
                ✓ Marcar Todos Presentes
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Matrícula</th>
                  <th>Nome do Aluno</th>
                  <th>Presença / Falta</th>
                  <th>Justificativa (se Falta Justificada)</th>
                </tr>
              </thead>
              <tbody>
                ${alunosChamada.map(aluno => {
                  const p = presencasAtuais[aluno.id] || { status: 'PRESENTE', justificativa: '' };
                  return `
                    <tr>
                      <td>${aluno.matricula}</td>
                      <td><strong>${aluno.nome}</strong></td>
                      <td>
                        <div class="attendance-toggle">
                          <button type="button" class="${p.status === 'PRESENTE' ? 'active-p' : ''}" onclick="setStatus('${aluno.id}', 'PRESENTE')" ${!isDiaLetivo ? 'disabled' : ''}>P</button>
                          <button type="button" class="${p.status === 'FALTA' ? 'active-f' : ''}" onclick="setStatus('${aluno.id}', 'FALTA')" ${!isDiaLetivo ? 'disabled' : ''}>F</button>
                          <button type="button" class="${p.status === 'FALTA_JUSTIFICADA' ? 'active-fj' : ''}" onclick="setStatus('${aluno.id}', 'FALTA_JUSTIFICADA')" ${!isDiaLetivo ? 'disabled' : ''}>FJ</button>
                        </div>
                      </td>
                      <td>
                        <input type="text" class="form-control" id="just-${aluno.id}" value="${p.justificativa || ''}"
                               placeholder="Motivo da falta..."
                               style="${p.status === 'FALTA_JUSTIFICADA' ? '' : 'display: none;'}"
                               onchange="setJustificativa('${aluno.id}', this.value)" ${!isDiaLetivo ? 'disabled' : ''}>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
            <button class="btn btn-success btn-lg" onclick="salvarChamadaEmLote()" ${!isDiaLetivo ? 'disabled' : ''}>
              💾 Salvar Chamada
            </button>
          </div>
        </div>
      `;

      container.innerHTML = tableHtml;
    }

    function setStatus(alunoId, status) {
      if (!presencasAtuais[alunoId]) presencasAtuais[alunoId] = {};
      presencasAtuais[alunoId].status = status;
      renderTabelaChamada(true, null);
    }

    function setJustificativa(alunoId, texto) {
      if (!presencasAtuais[alunoId]) presencasAtuais[alunoId] = {};
      presencasAtuais[alunoId].justificativa = texto;
    }

    function marcarTodosPresentes() {
      Object.keys(presencasAtuais).forEach(alunoId => {
        presencasAtuais[alunoId].status = 'PRESENTE';
        presencasAtuais[alunoId].justificativa = '';
      });
      renderTabelaChamada(true, null);
      UI.toast('Todos os alunos foram marcados como Presentes.', 'info');
    }

    async function salvarChamadaEmLote() {
      const turmaId = document.getElementById('select-turma').value;
      const disciplinaId = document.getElementById('select-disciplina').value;
      const data = document.getElementById('input-data').value;

      const lotePayload = Object.keys(presencasAtuais).map(alunoId => ({
        alunoId,
        turmaId,
        disciplinaId,
        data,
        status: presencasAtuais[alunoId].status,
        justificativa: presencasAtuais[alunoId].status === 'FALTA_JUSTIFICADA' ? presencasAtuais[alunoId].justificativa : null
      }));

      UI.confirm({
        title: 'Salvar Chamada',
        message: `Deseja registrar a chamada do dia ${UI.formatDate(data)} com ${lotePayload.length} alunos?`,
        confirmText: 'Salvar Frequência',
        onConfirm: async () => {
          try {
            await api.post('/presencas/lote', lotePayload);
            UI.toast('Chamada salva com sucesso!', 'success');
            carregarListaAlunos();
          } catch (err) {
            console.error(err);
          }
        }
      });
    }
  </script>
</body>
</html>
