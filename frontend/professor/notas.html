<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamento de Notas - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Lançamento de Notas</h1>
            <p class="page-subtitle">Inserção e edição de notas bimestrais com cálculo de média em tempo real (RN-01)</p>
          </div>
        </div>

        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="select-turma">Turma <span class="required">*</span></label>
              <select id="select-turma" class="form-select" onchange="loadDisciplinasTurma()">
                <option value="">Selecione uma turma...</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="select-disciplina">Disciplina <span class="required">*</span></label>
              <select id="select-disciplina" class="form-select">
                <option value="">Selecione uma disciplina...</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="select-bimestre">Bimestre <span class="required">*</span></label>
              <select id="select-bimestre" class="form-select">
                <option value="1">1º Bimestre</option>
                <option value="2">2º Bimestre</option>
                <option value="3">3º Bimestre</option>
                <option value="4">4º Bimestre</option>
              </select>
            </div>
            <div>
              <button class="btn btn-primary" onclick="carregarGradeNotas()">📋 Carregar Alunos e Notas</button>
            </div>
          </div>
        </div>

        <div id="notas-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    let vinculosProfessor = [];
    let alunosTurma = [];
    let notasLocais = {}; // { alunoId: { PROVA: {id, valor, peso}, TRABALHO: {id, valor, peso}, ATIVIDADE: {id, valor, peso} } }

    const PESOS_PADRAO = {
      PROVA: 5,
      TRABALHO: 3,
      ATIVIDADE: 2
    };

    document.addEventListener('DOMContentLoaded', async () => {
      await loadVinculosProfessor();
    });

    async function loadVinculosProfessor() {
      const session = Auth.getSession();
      const profId = session ? session.vinculoId : null;

      if (!profId) {
        UI.toast('Identificador do professor não encontrado.', 'error');
        return;
      }

      try {
        vinculosProfessor = await api.get(`/vinculos?professorId=${profId}`).catch(() => []);

        const turmasMap = new Map();
        vinculosProfessor.forEach(v => {
          if (v.turma) {
            turmasMap.set(v.turma.id || v.turmaId, v.turma.nome || `Turma ${v.turmaId}`);
          } else if (v.turmaId) {
            turmasMap.set(v.turmaId, `Turma (${v.turmaId})`);
          }
        });

        const selectTurma = document.getElementById('select-turma');
        selectTurma.innerHTML = '<option value="">Selecione uma turma...</option>';
        turmasMap.forEach((nome, id) => {
          selectTurma.innerHTML += `<option value="${id}">${nome}</option>`;
        });
      } catch (e) {
        console.error(e);
      }
    }

    function loadDisciplinasTurma() {
      const turmaId = document.getElementById('select-turma').value;
      const selectDisc = document.getElementById('select-disciplina');
      selectDisc.innerHTML = '<option value="">Selecione uma disciplina...</option>';

      if (!turmaId) return;

      const vinculosTurma = vinculosProfessor.filter(v => v.turmaId === turmaId || (v.turma && v.turma.id === turmaId));
      vinculosTurma.forEach(v => {
        const discId = v.disciplinaId || (v.disciplina ? v.disciplina.id : null);
        const discNome = v.disciplina ? v.disciplina.nome : `Disciplina ${discId}`;
        selectDisc.innerHTML += `<option value="${discId}">${discNome}</option>`;
      });
    }

    async function carregarGradeNotas() {
      const turmaId = document.getElementById('select-turma').value;
      const disciplinaId = document.getElementById('select-disciplina').value;
      const bimestre = document.getElementById('select-bimestre').value;
      const container = document.getElementById('notas-container');

      if (!turmaId || !disciplinaId || !bimestre) {
        UI.toast('Selecione Turma, Disciplina e Bimestre!', 'warning');
        return;
      }

      container.innerHTML = UI.renderLoading('Carregando lista de alunos e notas...');

      try {
        const [alunos, notasSalvas] = await Promise.all([
          api.get(`/alunos?turmaId=${turmaId}`).catch(() => []),
          api.get(`/notas?turmaId=${turmaId}&disciplinaId=${disciplinaId}&bimestre=${bimestre}`).catch(() => [])
        ]);

        alunosTurma = alunos;

        if (!alunosTurma || alunosTurma.length === 0) {
          container.innerHTML = UI.renderEmptyState('Sem alunos', 'Nenhum aluno cadastrado nesta turma.');
          return;
        }

        // Mapeia notas salvas para a estrutura local
        notasLocais = {};
        alunosTurma.forEach(aluno => {
          notasLocais[aluno.id] = {
            PROVA: { id: null, valor: '', peso: PESOS_PADRAO.PROVA },
            TRABALHO: { id: null, valor: '', peso: PESOS_PADRAO.TRABALHO },
            ATIVIDADE: { id: null, valor: '', peso: PESOS_PADRAO.ATIVIDADE }
          };
        });

        if (Array.isArray(notasSalvas)) {
          notasSalvas.forEach(n => {
            if (notasLocais[n.alunoId] && notasLocais[n.alunoId][n.tipo]) {
              notasLocais[n.alunoId][n.tipo] = {
                id: n.id,
                valor: n.valor !== null && n.valor !== undefined ? String(n.valor) : '',
                peso: n.peso || PESOS_PADRAO[n.tipo]
              };
            }
          });
        }

        renderTabelaNotas();
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar as notas.');
      }
    }

    function renderTabelaNotas() {
      const container = document.getElementById('notas-container');

      let html = `
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Grade de Notas (${alunosTurma.length} Alunos)</h2>
            <span style="font-size: 0.85rem; color: var(--text-muted);">pesos: Prova (${PESOS_PADRAO.PROVA}), Trabalho (${PESOS_PADRAO.TRABALHO}), Atividade (${PESOS_PADRAO.ATIVIDADE})</span>
          </div>

          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Matrícula</th>
                  <th>Nome do Aluno</th>
                  <th>PROVA (0 a 10)</th>
                  <th>TRABALHO (0 a 10)</th>
                  <th>ATIVIDADE (0 a 10)</th>
                  <th>Média Ponderada</th>
                </tr>
              </thead>
              <tbody>
                ${alunosTurma.map(aluno => {
                  const media = calcularMediaAluno(aluno.id);
                  const p = notasLocais[aluno.id];

                  return `
                    <tr>
                      <td>${aluno.matricula}</td>
                      <td><strong>${aluno.nome}</strong></td>
                      <td>
                        <input type="number" step="0.01" min="0" max="10" class="form-control" style="width: 100px;"
                               value="${p.PROVA.valor}"
                               placeholder="0.00"
                               oninput="atualizarNotaLocal('${aluno.id}', 'PROVA', this.value)">
                      </td>
                      <td>
                        <input type="number" step="0.01" min="0" max="10" class="form-control" style="width: 100px;"
                               value="${p.TRABALHO.valor}"
                               placeholder="0.00"
                               oninput="atualizarNotaLocal('${aluno.id}', 'TRABALHO', this.value)">
                      </td>
                      <td>
                        <input type="number" step="0.01" min="0" max="10" class="form-control" style="width: 100px;"
                               value="${p.ATIVIDADE.valor}"
                               placeholder="0.00"
                               oninput="atualizarNotaLocal('${aluno.id}', 'ATIVIDADE', this.value)">
                      </td>
                      <td>
                        <strong id="media-${aluno.id}" style="font-size: 1.1rem; color: ${media !== null && media >= 6 ? 'var(--color-success)' : (media !== null ? 'var(--color-danger)' : 'var(--text-main)')}">
                          ${media !== null ? UI.formatGrade(media) : '-'}
                        </strong>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
            <button class="btn btn-success btn-lg" onclick="salvarNotasEmLote()">
              💾 Salvar Todas as Notas
            </button>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function atualizarNotaLocal(alunoId, tipo, valor) {
      // RN-01 Validação de input (0-10)
      let numVal = parseFloat(valor);
      if (isNaN(numVal)) {
        notasLocais[alunoId][tipo].valor = '';
      } else {
        if (numVal < 0) numVal = 0;
        if (numVal > 10) numVal = 10;
        notasLocais[alunoId][tipo].valor = String(numVal);
      }

      // Recalcula e atualiza a média exibida sem re-renderizar a tabela inteira
      const media = calcularMediaAluno(alunoId);
      const mediaEl = document.getElementById(`media-${alunoId}`);
      if (mediaEl) {
        if (media !== null) {
          mediaEl.textContent = UI.formatGrade(media);
          mediaEl.style.color = media >= 6 ? 'var(--color-success)' : 'var(--color-danger)';
        } else {
          mediaEl.textContent = '-';
          mediaEl.style.color = 'var(--text-main)';
        }
      }
    }

    function calcularMediaAluno(alunoId) {
      const p = notasLocais[alunoId];
      if (!p) return null;

      let somaNotas = 0;
      let somaPesos = 0;

      ['PROVA', 'TRABALHO', 'ATIVIDADE'].forEach(tipo => {
        const item = p[tipo];
        if (item.valor !== '' && !isNaN(parseFloat(item.valor))) {
          const val = parseFloat(item.valor);
          somaNotas += val * item.peso;
          somaPesos += item.peso;
        }
      });

      if (somaPesos === 0) return null;
      return somaNotas / somaPesos;
    }

    async function salvarNotasEmLote() {
      const turmaId = document.getElementById('select-turma').value;
      const disciplinaId = document.getElementById('select-disciplina').value;
      const bimestre = Number(document.getElementById('select-bimestre').value);

      // Prepara lista de requisições de salvar nota
      const requests = [];

      Object.keys(notasLocais).forEach(alunoId => {
        const studentNotas = notasLocais[alunoId];
        ['PROVA', 'TRABALHO', 'ATIVIDADE'].forEach(tipo => {
          const item = studentNotas[tipo];
          if (item.valor !== '') {
            const body = {
              alunoId,
              disciplinaId,
              turmaId,
              bimestre,
              tipo,
              valor: Number(parseFloat(item.valor).toFixed(2)),
              peso: item.peso
            };

            if (item.id) {
              requests.push(api.put(`/notas/${item.id}`, body));
            } else {
              requests.push(api.post('/notas', body));
            }
          }
        });
      });

      if (requests.length === 0) {
        UI.toast('Nenhuma nota informada para salvar.', 'warning');
        return;
      }

      try {
        UI.toast('Salvando notas...', 'info');
        await Promise.all(requests);
        UI.toast('Todas as notas foram salvas com sucesso!', 'success');
        carregarGradeNotas();
      } catch (err) {
        UI.toast('Algumas notas não puderam ser salvas. Verifique os valores.', 'error');
      }
    }
  </script>
</body>
</html>
