<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocorrências - Sistema Escolar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-header" class="app-header"></header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Registro de Ocorrências</h1>
            <p class="page-subtitle">Acompanhamento disciplinar e pedagógico dos alunos</p>
          </div>
          <button class="btn btn-primary" onclick="openOcorrenciaModal()">
            ➕ Nova Ocorrência
          </button>
        </div>

        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    let alunosList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await loadAlunosOptions();
      await loadOcorrencias();
    });

    async function loadAlunosOptions() {
      try {
        alunosList = await api.get('/alunos').catch(() => []);
      } catch (e) {
        console.error(e);
      }
    }

    async function loadOcorrencias() {
      const container = document.getElementById('table-container');
      container.innerHTML = UI.renderLoading('Carregando ocorrências...');

      try {
        const ocorrencias = await api.get('/ocorrencias');

        const columns = [
          {
            key: 'aluno',
            label: 'Aluno',
            render: (val, row) => {
              if (val && val.nome) return val.nome;
              const found = alunosList.find(a => a.id === row.alunoId);
              return found ? found.nome : `Aluno (${row.alunoId})`;
            }
          },
          { key: 'tipo', label: 'Tipo', render: (val) => UI.badge(val) },
          { key: 'descricao', label: 'Descrição' },
          { key: 'status', label: 'Status', render: (val) => UI.badge(val) }
        ];

        container.innerHTML = UI.renderTable(columns, ocorrencias, 'Nenhuma ocorrência registrada.');
      } catch (err) {
        container.innerHTML = UI.renderEmptyState('Erro', 'Não foi possível carregar o histórico de ocorrências.');
      }
    }

    function openOcorrenciaModal() {
      const alunosOptions = alunosList.map(a => `<option value="${a.id}">${a.nome} (${a.matricula})</option>`).join('');

      const formHtml = `
        <form id="form-oc">
          <div class="form-group">
            <label>Aluno <span class="required">*</span></label>
            <select id="oc-aluno" class="form-select" required>
              <option value="">Selecione o aluno...</option>
              ${alunosOptions}
            </select>
          </div>
          <div class="form-group">
            <label>Tipo de Ocorrência <span class="required">*</span></label>
            <select id="oc-tipo" class="form-select" required>
              <option value="DISCIPLINAR">Disciplinar</option>
              <option value="PEDAGOGICO">Pedagógico</option>
              <option value="OUTRO">Outro</option>
            </select>
          </div>
          <div class="form-group">
            <label>Descrição dos Fatos <span class="required">*</span></label>
            <textarea id="oc-desc" class="form-control" rows="4" placeholder="Detalhe o ocorrido..." required></textarea>
          </div>
        </form>
      `;

      UI.modal({
        title: 'Registrar Nova Ocorrência',
        content: formHtml,
        actions: [
          { label: 'Cancelar', class: 'btn-secondary', onClick: () => UI.closeModal() },
          {
            label: 'Salvar Ocorrência',
            class: 'btn-primary',
            onClick: async () => {
              const body = {
                alunoId: document.getElementById('oc-aluno').value,
                tipo: document.getElementById('oc-tipo').value,
                descricao: document.getElementById('oc-desc').value.trim()
              };

              if (!body.alunoId || !body.tipo || !body.descricao) {
                UI.toast('Preencha todos os campos obrigatórios!', 'warning');
                return;
              }

              try {
                await api.post('/ocorrencias', body);
                UI.toast('Ocorrência registrada com sucesso!', 'success');
                UI.closeModal();
                loadOcorrencias();
              } catch (e) {}
            }
          }
        ]
      });
    }
  </script>
</body>
</html>
